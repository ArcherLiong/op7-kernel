name: build-docker-kernel

# 触发方式
#   1) 推代码到 main 时自动跑
#   2) 仓库页面 -> Actions -> build-docker-kernel -> Run workflow（可改参数）
on:
  workflow_dispatch:
    inputs:
      lto:
        description: "保持官方 LTO（1=是，推荐；0=关闭，编译快一倍但内核对不上官方 codegen）"
        required: false
        default: "1"
      sspguard:
        description: "1=注入 -fstack-protector-guard=global（金丝雀走全局变量，对齐官方）；0=不开"
        required: false
        default: "0"
      vanilla:
        description: "1=不叠加容器选项，配置与官方逐条一致（对照组，排查启动失败用）；0=正常容器内核"
        required: false
        default: "0"
      pstore:
        description: "1=额外开启 PSTORE（崩溃日志捕获，本机 ramoops 保留内存可用）；0=不开"
        required: false
        default: "0"
      ias:
        description: "1=用 clang 集成汇编器(LLVM_IAS=1)；0=用交叉 GNU as 4.9。4.14 内核看不出这项差异，是唯一未排除的编译环节"
        required: false
        default: "0"
      crashdump:
        description: "1=开启 MINIDUMP+RTB，把 panic 现场落进 rawdump 分区（崩溃排查用）；0=不开"
        required: false
        default: "0"
      clang_build:
        description: "钉死 clang banner 构建号（官方=15071444；留空则用此默认）"
        required: false
        default: "15071444"
      kernel_commit:
        description: "内核提交（默认就是官方构建用的那个，别乱改）"
        required: false
        default: "9f007fac27dce21d29d8230753b71d5634b8a00e"
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8150.git
  KERNEL_BRANCH: lineage-24.0
  KERNEL_COMMIT: ${{ github.event.inputs.kernel_commit || '9f007fac27dce21d29d8230753b71d5634b8a00e' }}
  CLANG_VER: clang-r596125
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  GCC64_URL: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
  GCC32_URL: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
  MAGISK_URL: https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
  BOOT_URL: https://mirrorbits.lineageos.org/full/guacamoleb/20261101/boot.img
  BOOT_SHA256: b076fd18bd6282b0f60ef27747a151a3926e39197a7a2abb001aa6181d023f3a
  IAS: ${{ github.event.inputs.ias || '0' }}
  CRASHDUMP: ${{ github.event.inputs.crashdump || '0' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: 取本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          [ -n "${AGENT_TOOLSDIRECTORY:-}" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev libncurses-dev lz4 python3 rsync \
            unzip zip device-tree-compiler zstd
          df -h /

      # ---------------------------------------------------------------------
      # 工具链 1/2: clang。官方内核的 version banner 里写死了
      # "clang version 22.0.2, based on r596125"，所以优先用它；
      # 万一上游把该目录归档了，就退到列表里次新的，并在日志里大声提示。
      # ---------------------------------------------------------------------
      - name: 准备工具链 · clang（按 banner 构建号钉死）
        run: |
          set -e
          mkdir -p toolchain
          # 不用 --depth 1：需要该目录的完整提交历史，才能回退到官方构建时的那一版
          git clone --filter=blob:none --no-checkout "$CLANG_URL" toolchain/clang
          cd toolchain/clang
          git ls-tree --name-only HEAD | grep '^clang-r' | sort -V > /tmp/clang-list.txt
          echo "可用 clang 目录共 $(wc -l < /tmp/clang-list.txt) 个，最新 5 个："
          tail -5 /tmp/clang-list.txt

          pick=""
          for c in "$CLANG_VER" clang-r590651 clang-r584079 clang-r574358 clang-r560880 clang-r547379 clang-r536225 clang-r522817; do
            if grep -qx "$c" /tmp/clang-list.txt; then pick="$c"; break; fi
          done
          if [ -z "$pick" ]; then
            pick=$(tail -1 /tmp/clang-list.txt)
            echo "::warning::没找到 $CLANG_VER，退到最新的 $pick —— 可能与官方 codegen 不同"
          fi
          echo "目录: $pick"

          # AOSP 会原地更新同名 clang 目录。官方内核构建于 2026-11-01 02:33 UTC，
          # banner 是 Android (15071444, ...)；HEAD 上可能已经是更新的构建号。
          # 遍历该目录的提交历史，找到 banner 里含 (WANT, 的那一版并钉死。
          WANT="${{ github.event.inputs.clang_build || '15071444' }}"
          echo "目标构建号: $WANT"
          git log --format='%H' -- "$pick" > /tmp/cc.txt
          echo "历史提交数: $(wc -l < /tmp/cc.txt)"

          git sparse-checkout init --cone
          found=""
          n=0
          for commit in $(cat /tmp/cc.txt); do
            n=$((n+1)); [ $n -gt 15 ] && break
            git sparse-checkout set "$pick/bin" >/dev/null 2>&1 || true
            git checkout -f "$commit" >/dev/null 2>&1 || continue
            v=$("$pick/bin/clang" --version 2>/dev/null | grep -m1 '^Android' || true)
            echo "  [$n] ${commit:0:10}  ${v:-(不可执行/无 banner)}"
            if [ -n "$v" ] && echo "$v" | grep -q "($WANT,"; then found=$commit; break; fi
          done

          if [ -n "$found" ]; then
            git sparse-checkout set "$pick"
            git checkout -f "$found"
            echo "已钉死 clang 构建号 $WANT -> $found"
          else
            echo "::warning::历史中未找到构建号 $WANT，使用 HEAD（codegen 可能与官方不同）"
            git sparse-checkout set "$pick"
            git checkout -f HEAD
          fi
          test -x "$pick/bin/clang" || { echo "::error::sparse checkout 后没有 $pick/bin/clang"; exit 1; }
          "./$pick/bin/clang" --version | head -2
          du -sh .
          echo "CLANG_VER=$pick" >> "$GITHUB_ENV"

      - name: 准备工具链 · aarch64 / arm 交叉 binutils
        run: |
          git clone --depth 1 "$GCC64_URL" toolchain/gcc64
          git clone --depth 1 "$GCC32_URL" toolchain/gcc32
          chmod -R +x toolchain/gcc64/bin toolchain/gcc32/bin || true
          toolchain/gcc64/bin/aarch64-linux-android-gcc --version | head -1
          toolchain/gcc32/bin/arm-linux-androideabi-gcc --version | head -1
          # 内核在 LLVM_IAS != 1 时会调用 $(CROSS_COMPILE)elfedit 来定位工具链
          ls toolchain/gcc64/bin/aarch64-linux-android-elfedit
          df -h /

      - name: 拉取内核源码
        run: |
          set -e
          # 浅克隆即可：版本串不依赖 git describe，由配置写死
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          got=$(git rev-parse HEAD)
          echo "HEAD   : $got"
          echo "期望   : $KERNEL_COMMIT"
          if [ "$got" != "$KERNEL_COMMIT" ]; then
            echo "分支头已经变了，按指定提交重新检出"
            git fetch --depth 1 origin "$KERNEL_COMMIT"
            git checkout -f "$KERNEL_COMMIT"
            git rev-parse HEAD
          fi
          du -sh .

      - name: 拉取官方 boot.img（只作重打包模板）
        run: |
          curl -L --retry 5 --retry-delay 5 --max-time 900 -o boot-orig.img "$BOOT_URL"
          echo "$BOOT_SHA256  boot-orig.img" | sha256sum -c -
          ls -l boot-orig.img

      - name: 配置内核
        env:
          LTO: ${{ github.event.inputs.lto || '1' }}
          VANILLA: ${{ github.event.inputs.vanilla || '0' }}
          PSTORE: ${{ github.event.inputs.pstore || '0' }}
          IAS: ${{ github.event.inputs.ias || '0' }}
          CRASHDUMP: ${{ github.event.inputs.crashdump || '0' }}
        run: bash scripts/build.sh configure

      - name: 校验配置
        env:
          VANILLA: ${{ github.event.inputs.vanilla || '0' }}
        run: bash scripts/build.sh verify

      - name: 编译内核
        env:
          LTO: ${{ github.event.inputs.lto || '1' }}
          SSPGUARD: ${{ github.event.inputs.sspguard || '1' }}
          KBUILD_BUILD_TIMESTAMP: ${{ github.event.inputs.build_timestamp || 'Sun Nov  1 02:33:07 UTC 2026' }}
          KBUILD_BUILD_USER: root
          KBUILD_BUILD_HOST: 0ef44fd3c1b1
        run: bash scripts/build.sh build

      - name: 准备 magiskboot
        run: |
          curl -L --retry 3 --max-time 300 -o magisk.apk "$MAGISK_URL"
          unzip -o -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv -f libmagiskboot.so magiskboot
          chmod +x magiskboot
          mkdir -p "$HOME/.local/bin"
          cp magiskboot "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./magiskboot 2>&1 | head -5 || true

      - name: 重打包 boot.img
        run: bash scripts/build.sh repack

      - name: 失败也保留日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            kernel.config
            out/include/generated/utsrelease.h
          if-no-files-found: ignore
          retention-days: 7

      - name: 汇总
        run: |
          {
            echo "## 内核编译完成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 内核提交 | \`$KERNEL_COMMIT\` |"
            echo "| 工具链 | $CLANG_VER / LLVM |"
            echo "| LTO | ${{ github.event.inputs.lto || '1' }} |"
            echo "| vanilla | ${{ github.event.inputs.vanilla || '0' }} |"
            echo "| PSTORE | ${{ github.event.inputs.pstore || '0' }} |"
            echo "| utsrelease | \`$(grep -o '\"[^\"]*\"' out/include/generated/utsrelease.h | tr -d '\"')\` |"
            echo "| 大小 | $(stat -c%s boot-docker.img) 字节 |"
            echo "| sha256 | \`$(cut -d' ' -f1 boot-docker.sha256)\` |"
            echo ""
            echo "下载 artifact \`boot-docker-guacamoleb\`，然后用 fb.py 刷入："
            echo ""
            echo '```'
            echo "python fb.py flash boot boot-docker.img"
            echo "python fb.py reboot"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: boot-i${{ github.event.inputs.ias || '0' }}-c${{ github.event.inputs.crashdump || '0' }}-v${{ github.event.inputs.vanilla || '0' }}-s${{ github.event.inputs.sspguard || '1' }}
          path: |
            boot-docker.img
            boot-docker.sha256
            kernel.config
          if-no-files-found: error
          retention-days: 30
